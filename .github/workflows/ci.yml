name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: gwt-linux-x64
            binary: target/release/gwt
          - runner: ubuntu-24.04-arm
            artifact: gwt-linux-arm64
            binary: target/release/gwt
          - runner: macos-15-intel
            artifact: gwt-darwin-x64
            binary: target/release/gwt
          - runner: macos-15
            artifact: gwt-darwin-arm64
            binary: target/release/gwt
          - runner: windows-2025
            artifact: gwt-windows-x64.exe
            binary: target/release/gwt.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --locked --release
      - name: Upload to release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes 2>/dev/null || true
          cp "${{ matrix.binary }}" "${{ matrix.artifact }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.artifact }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
