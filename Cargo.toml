[package]
name = "gwt"
version = "0.7.1"
edition = "2024"
authors = ["Ivan Zakharchanka <3axap4eHko@gmail.com>"]
description = "Fast git worktree manager with bare repository workflow"
license = "MIT"
repository = "https://github.com/3axap4eHko/gwt"
homepage = "https://github.com/3axap4eHko/gwt"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
rust-version = "1.96"

[[bin]]
name = "gwt"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[dependencies]
clonetree = "=0.0.2"
dialoguer = { version = "=0.12.0", default-features = false }
reqwest = { version = "=0.13.3", features = ["blocking"] }
sha2 = "=0.10.9"
